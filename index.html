    <title>
      Area And Perimeter Real Life Word Problems
    </title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: url("assets/Backgrounds.png");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        object-fit: cover;
        min-height: 100vh;
      }

      #heading {
        text-align: center;
        background-color: whitesmoke;
        padding: 10px 20px;
        margin: 10px auto;
        color: black;
        font-size: 1.9em;
        font-weight: 600;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        width: fit-content;
        border-radius: 10px;
      }

      .activity {
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        gap: 20px;
        height: auto;
      }

      .sidebar {
        width: 100px;
        height: fit-content;
        max-height: 65vh;
        overflow-y: auto;
      }

      .sidebar h3 {
        color: white;
        text-align: center;
        margin-bottom: 15px;
        font-size: 1.1em;
      }

      .questionButtons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .qBtn {
        padding: 12px 15px;
        border: none;
        border-radius: 10px;
        background-color: #f5f5f5;
        color: black;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: bold;
        width: 85%;
        text-align: center;
        box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
        position: relative;
      }

      .qBtn:hover {
        background-color: #e8e8e8;
        transform: translateY(-1px);
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.7);
      }

      .qBtn.active {
        background-color: #f5f5f5;
        box-shadow: none;
        border: 3px solid #000;
        transform: translateY(2px);
      }

      .qBtn:active {
        box-shadow: none;
        border: 3px solid #000;
        transform: translateY(2px);
      }

      .mainContent {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .backGroundMainDiv {
        position: relative;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 20px 30px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        min-height: 500px;
        flex: 1;
      }

      #backgroundImage {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 20px;
        opacity: 0.05;
        z-index: 1;
      }

      .questionContent {
        position: relative;
        z-index: 2;
      }

      .questionText {
        font-size: 1.8em;
        margin-bottom: 30px;
        color: #333;
        text-align: center;
        line-height: 1.4;
      }

      .middleSection {
        display: flex;
        gap: 2%;
        align-items: flex-start;
      }

      .inputMiddleSection {
        display: flex;
        gap: 2%;
        align-items: flex-start;
        min-height: 300px;
      }

      .inputImageSection {
        flex: 0 0 40%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 20px;
      }

      .inputQuestionSection {
        flex: 0 0 58%;
        display: flex;
        flex-direction: column;
      }

      .inputQuestionText {
        font-size: 1.4em;
        margin-bottom: 20px;
        color: #333;
        line-height: 1.4;
        text-align: left;
      }

      .inputBottomSection {
        display: flex;
        gap: 20px;
        align-items: center;
        margin-top: 10px;
      }

      .inputFeedbackSection {
        flex: 1;
      }

      .inputButtonSection {
        flex: 1;
        display: flex;
        justify-content: flex-end;
      }

      .imageSection {
        flex: 0 0 38%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .questionImg {
        max-width: 100%;
        max-height: 350px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .optionsSection {
        flex: 0 0 60%;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .middleSection:not(:has(.imageSection)) .optionsSection {
        flex: 0 0 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .inputMiddleSection.no-image {
        display: block;
      }

      .inputMiddleSection.no-image .inputQuestionSection {
        flex: none;
        width: 100%;
      }

      .optionGrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      .optionBtn {
        padding: 20px;
        border: 3px solid #ddd;
        border-radius: 15px;
        background: white;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 1.6em;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        word-break: break-word;
        position: relative;
      }

      .optionBtn:hover {
        border-color: #667eea;
        background: #f8f9ff;
        transform: scale(1.05);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
      }

      .optionBtn.correct {
        background: #d4edda;
        border-color: #4caf50;
        color: #155724;
        box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
      }

      .optionBtn.incorrect {
        background: #f8d7da;
        border-color: #f44336;
        color: #721c24;
        box-shadow: 0 8px 25px rgba(244, 67, 54, 0.4);
      }

      .optionImage {
        max-width: 280px;
        max-height: 280px;
        object-fit: contain;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .optionBtn.image-option {
        min-height: 280px;
        padding: 15px;
      }

      .optionBtn.image-option:hover {
        background: linear-gradient(145deg, #f8f9ff, #e8e9ff);
      }

      .optionBtn.image-option.correct {
        background: linear-gradient(145deg, #d4edda, #c3e6cb);
      }

      .optionBtn.image-option.incorrect {
        background: linear-gradient(145deg, #f8d7da, #f1c2c7);
      }

      .inputGrid {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 20px;
        align-items: center;
      }

      .inputContainer {
        display: flex;
        align-items: center;
        gap: 15px;
        width: 100%;
        max-width: 400px;
      }

      .inputLabel {
        font-size: 1.2em;
        font-weight: bold;
        color: #333;
        min-width: 80px;
      }

      .answerInput {
        flex: 1;
        padding: 15px 20px;
        border: 3px solid #ddd;
        border-radius: 10px;
        font-size: 1.1em;
        text-align: center;
        transition: all 0.3s ease;
        background: white;
      }

      .inline-input {
        display: inline-block;
        width: 90px;
        padding: 2px 2px;
        border: 2px solid #667eea;
        border-radius: 8px;
        font-size: 0.9em;
        text-align: center;
        margin: 3px 5px;
        background: white;
        transition: all 0.3s ease;
      }

      .inline-input:focus {
        outline: none;
        border-color: #4caf50;
        box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
      }

      .inline-input.correct {
        border-color: #4caf50;
        background: #d4edda;
        color: #155724;
      }

      .inline-input.incorrect {
        border-color: #f44336;
        background: #f8d7da;
        color: #721c24;
      }

      .answerInput:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
      }

      .answerInput.correct {
        border-color: #4caf50;
        background: #d4edda;
        color: #155724;
      }

      .answerInput.incorrect {
        border-color: #f44336;
        background: #f8d7da;
        color: #721c24;
      }

      .checkBtn {
        padding: 15px 30px;
        border: none;
        border-radius: 25px;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        cursor: pointer;
        font-size: 1.1em;
        font-weight: bold;
        transition: all 0.3s ease;
        margin: 20px auto;
        display: block;
      }

      .checkBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      }

      .feedbackText {
        font-size: 1.2em;
        text-align: center;
        margin: 20px 0;
        font-weight: bold;
        min-height: 30px;
      }

      .emoji {
        font-size: 1.5em;
        margin-right: 10px;
      }

      .nextBtn {
        padding: 15px 30px;
        border: none;
        border-radius: 25px;
        background: linear-gradient(45deg, #4caf50, #45a049);
        color: white;
        cursor: pointer;
        font-size: 1.1em;
        font-weight: bold;
        transition: all 0.3s ease;
        display: block;
        margin: 0 auto;
      }

      .nextBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
      }

      .finalScreen {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 400px;
        background: linear-gradient(45deg, #4caf50, #45a049);
        border-radius: 20px;
        color: white;
        font-size: 2em;
        text-align: center;
      }

      .finalImage {
        max-width: 300px;
        border-radius: 15px;
      }

      @media (max-width: 768px) {
        .activity {
          flex-direction: column;
          height: auto;
        }

        .sidebar {
          width: 100%;
          max-height: 150px;
          margin-bottom: 20px;
        }

        .questionButtons {
          flex-direction: row;
          flex-wrap: wrap;
          justify-content: center;
        }

        .qBtn {
          width: auto;
          min-width: 50px;
        }

        .middleSection,
        .inputMiddleSection {
          flex-direction: column;
          gap: 20px;
        }

        .inputImageSection,
        .inputQuestionSection {
          flex: 1 1 100%;
        }

        .inputBottomSection {
          flex-direction: column;
          gap: 15px;
        }

        .inputButtonSection {
          justify-content: center;
        }

        .questionText,
        .inputQuestionText {
          font-size: 1.2em;
        }

        .optionGrid {
          grid-template-rows: 1fr 1fr;
          gap: 15px;
        }

        .optionBtn {
          font-size: 1em;
          padding: 15px;
          min-height: 100px;
        }

        .optionBtn.image-option {
          min-height: 120px;
        }

        .optionImage {
          max-width: 200px;
          max-height: 200px;
        }

        .inputContainer {
          flex-direction: column;
          text-align: center;
        }

        .inputLabel {
          min-width: auto;
        }

        .inline-input {
          width: 40px;
          font-size: 1em;
        }
      }

      .optionGrid.three-options {
        grid-template-columns: 1fr 1fr;
      }

      .optionGrid.three-options .optionBtn:nth-child(3) {
        /* grid-column: 1 / -1; */
      }

      .optionGrid.one-option {
        grid-template-columns: 1fr;
      }

      .optionGrid.has-images {
        grid-template-columns: 1fr 1fr;
        gap: 25px;
      }

      .optionGrid.has-images .optionBtn {
        min-height: 160px;
      }

      .optionGrid.has-images .optionImage {
        max-width: 260px;
        max-height: 160px;
        width: 100%;
      }

      @media (max-width: 768px) {
        .optionGrid.has-images .optionBtn {
          min-height: 140px;
        }
      }

      .fraction-container {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        vertical-align: middle;
      }

      .whole-number {
        font-size: 1em;
      }

      .fraction {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        vertical-align: middle;
        font-size: 1em;
      }

      .numerator,
      .denominator {
  line-height: 1;
  padding: 2px 4px;
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
}
      .fraction-line {
        width: 100%;
        height: 2px;
        background-color: currentColor;
        margin: 2px 0;
      }

      .questionText .fraction-container {
        margin: 0 4px;
      }

      .optionBtn .fraction-container {
        justify-content: center;
      }

      .imageOption {
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
      }

      .imageOption img {
        max-width: 300px;
        max-height: 180px;
        width: 100%;
        object-fit: contain;
        border: 3px solid black;
        border-radius: 12px;
        transition: border 0.3s ease;
        padding: 0 1%;
      }

      .imageOption.correct img {
        border-color: #4caf50;
      }

      .imageOption.incorrect img {
        border-color: #f44336;
      }

      .imageOption:hover {
        transform: none;
        box-shadow: none;
      }

      /* =============================================
           FRACTION DIAGRAM STYLES
           ============================================= */
      .frac-diagram-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 10px 0 20px 0;
      }

      .frac-diagram {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
      }

      .frac-big {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 3em;
        font-weight: bold;
        line-height: 1;
        min-width: 60px;
        margin-right: 10px;
      }

      .frac-big .frac-line {
        width: 100%;
        height: 5px;
        background: #222;
        margin: 6px 0;
        border-radius: 2px;
      }

      .frac-arrow-middle {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .frac-arrow-middle .frac-equals-over {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2.8em;
        font-weight: bold;
        color: #222;
        z-index: 2;
        pointer-events: none;
      }

      .frac-multiply-label {
        font-size: 1.05em;
        font-weight: bold;
        color: #222;
        line-height: 1.3;
        text-align: center;
      }

      .frac-input-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        margin-left: 10px;
      }

      .frac-input-box input {
        width: 75px;
        height: 58px;
        border: 3px solid #444;
        border-radius: 8px;
        font-size: 1.8em;
        font-weight: bold;
        text-align: center;
        background: white;
        transition: all 0.3s ease;
        outline: none;
      }

      .frac-input-box input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
      }

      .frac-input-box input.correct {
        border-color: #4caf50;
        background: #d4edda;
        color: #155724;
      }

      .frac-input-box input.incorrect {
        border-color: #f44336;
        background: #f8d7da;
        color: #721c24;
      }

      .frac-input-box .frac-input-line {
        width: 75px;
        height: 4px;
        background: #444;
        border-radius: 2px;
      }

      .frac-factor-input {
        display: inline-block;
        width: 60px;
        height: 44px;
        border: 3px solid #444;
        border-radius: 8px;
        font-size: 1.4em;
        font-weight: bold;
        text-align: center;
        background: white;
        outline: none;
        transition: all 0.3s ease;
        vertical-align: middle;
      }
      .frac-factor-input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
      }
      .frac-factor-input.correct {
        border-color: #4caf50;
        background: #d4edda;
        color: #155724;
      }
      .frac-factor-input.incorrect {
        border-color: #f44336;
        background: #f8d7da;
        color: #721c24;
      }

      .inline-dropdown {
        height: 45px;
        font-size: 20px;
        padding: 5px;
        border-radius: 6px;
        border: 2px solid #444;
        text-align: center;
      }

      /* REPLACE old .root-box and .inline-input with: */
      .sqrt-wrapper {
        display: inline-flex;
        align-items: center;
        vertical-align: middle;
        margin: 0 3px;
        position: relative;
      }

      .sqrt-radical {
        font-size: 1.6em;
        font-family: serif;
        line-height: 1;
        color: #1a2a4a;
        margin-right: -2px;
        position: relative;
        top: 2px;
      }

      .sqrt-content {
        border-top: 2.5px solid #1a2a4a;
        display: inline-flex;
        align-items: center;
        padding: 3px 6px 2px 0px;
      }

      .sqrt-input {
        width: 50px;
        height: 32px;
        border: 2px solid #1a2a4a;

        border-radius: 5px 5px 5px 5px;
        font-size: 1em;
        font-weight: bold;
        text-align: center;
        background: white;
        outline: none;
        transition: all 0.3s ease;
      }

      .sqrt-input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
      }
      .sqrt-input.correct {
        border-color: #4caf50 !important;
        background: #d4edda;
        color: #155724;
      }
      .sqrt-input.incorrect {
        border-color: #f44336 !important;
        background: #f8d7da;
        color: #721c24;
      }

      .sqrt-fixed-text {
        font-size: 1em;
        font-weight: bold;
        padding: 0 3px;
        color: #222;
      }

      /* bhanu added */

      .base-with-power {
        display: inline-flex;
        align-items: flex-start;
        vertical-align: middle;
        margin: 0 4px;
      }

      .base-number {
        font-size: 1.8em;
        font-weight: bold;
        line-height: 1;
      }

      .power-input-wrapper {
        display: inline-flex;
        align-items: center;
        flex-direction: row;
        vertical-align: super;
        font-size: 0.7em;
        gap: 3px;
      }

      .super-input {
        width: 20px;
        height: 25px;
        font-size: 1em;
        border: 2px solid #667eea;
        border-radius: 5px;
        text-align: center;
        background: white;
        outline: none;
        padding: 0;
      }

      .power-input-wrapper .mini-frac {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        font-size: 0.85em;
        line-height: 1.1;
        vertical-align: middle;
        margin: 0 2px;
      }
      .power-input-wrapper .mini-frac .mini-line {
        width: 100%;
        min-width: 12px;
        height: 1.2px;
        background: #444;
        display: block;
        margin: 1px 0;
      }
      /* --- Long Division Square Root --- */
      .ld-container {
        display: grid;
        grid-template-columns: minmax(60px, auto) 6px minmax(130px, auto) 6px minmax(60px, auto);
        row-gap: 0px;
        align-items: stretch; /* Changed to stretch to fix vertical bracket lines */
        font-size: 1.5em;
        font-weight: bold;
        margin: 20px auto;
        width: max-content;
      }
      .ld-container .inline-input {
        width: 48px !important;
        height: 48px !important;
        font-size: 1em !important;
        padding: 0 !important;
        margin: 2px !important;
        border: 3px solid #666 !important;
        border-radius: 8px !important;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
      }
      .ld-container .inline-input:focus {
        border-color: #667eea !important;
      }
      .ld-container .inline-input.correct {
        border-color: #4caf50 !important;
        background: #d4edda !important;
        color: #155724 !important;
      }
      .ld-container .inline-input.incorrect {
        border-color: #f44336 !important;
        background: #f8d7da !important;
        color: #721c24 !important;
      }
      .compare-box-wrapper {
          position: relative;
          z-index: 20;
      }
      .compare-box-wrapper .inline-input {
          width: 120px !important;
          height: 50px !important;

      .table-graph-wrapper {

        // SVG-embedded input: style the sibling rect
        const fo = el.closest("foreignObject");
        if (fo) {
          let prev = fo.previousElementSibling;
          while (prev) {
            if (prev.tagName.toLowerCase() === "rect") {
              prev.setAttribute("stroke", color);
              prev.setAttribute("fill", bg);
              break;
            }
            prev = prev.previousElementSibling;

       } else {
  el.style.borderColor = color;

}

      // ─── ONE universal diagram builder ────────────────────────────────────────
      //
      //  Every slot in d (diagram JSON) is either:
      //    "someValue"  →  rendered as fixed bold text
      //    ""           →  rendered as an input box, id taken from d.slots in order
      //
      //  d fields:
      //    op        : "×" or "÷"
      //    fracNum   : left fraction numerator   (fixed or "")
      //    fracDen   : left fraction denominator (fixed or "")
      //    topLabel  : label above top arrow     (fixed or "")
      //    botLabel  : label below bottom arrow  (fixed or "")
      //    resNum    : right fraction numerator  (fixed or "")
      //    resDen    : right fraction denominator(fixed or "")
      //    slots     : array of input ids — consumed left-to-right for every "" slot
      //    arrowId   : unique string for SVG marker ids
      //
      //  Slot consumption order: fracNum, fracDen, topLabel, botLabel, resNum, resDen
      //
      function buildDiagramHTML(d) {
        const op = d.op || "×";
        const aid = d.arrowId;
        let slotIdx = 0;
        const slots = d.slots || [];

        // Returns SVG snippet for a slot: fixed text OR input box
        // tx, ty = text anchor position  |  rx,ry,rw,rh = rect geometry  |  inputH = input height
        function slot(
          value,
          id,
          tx,
          ty,
          anchor,
          fontSize,
          rx,
          ry,
          rw,
          rh,
          iw,
          ih,
        ) {
          if (value !== "") {
            // Fixed text
            return `<text x="${tx}" y="${ty}" text-anchor="${anchor}" font-size="52" font-weight="bold" fill="#111">${value}</text>`;
          } else {
            // Input box
            const sid = slots[slotIdx++] || id;
            return `
                    <rect id="rect-${sid}" x="${rx}" y="${ry}" width="${rw}" height="${rh}" rx="8" ry="8" fill="white" stroke="#444" stroke-width="3"/>
                    <foreignObject x="${rx}" y="${ry}" width="${rw}" height="${rh}">
                      <div xmlns="http://www.w3.org/1999/xhtml" style="width:${rw}px;height:${rh}px;display:flex;align-items:center;justify-content:center;">
                        <input type="text" id="${sid}" autocomplete="off"
                          style="width:${iw}px;height:${ih}px;border:none;outline:none;font-size:${fontSize}px;font-weight:bold;text-align:center;background:transparent;"/>
                      </div>
                    </foreignObject>`;
          }
        }

        // Label slot (above/below arrow)
        // Fixed: shows "op value" centred above/below arrow
        // Input: op symbol to the LEFT, input box to its RIGHT — always visible
        function labelSlot(value, fallbackId, tx, ty, anchor, rx, ry) {
          if (value !== "") {
            return `<text x="${tx}" y="${ty}" text-anchor="${anchor}" font-size="20" font-weight="bold" fill="#222">${op} ${value}</text>`;
          } else {
            const sid = slots[slotIdx++] || fallbackId;
            const opX = 202; // op symbol ends here (text-anchor=end)
            const boxX = 207; // input box starts just after op symbol
            return `
                    <text x="${opX}" y="${ty}" text-anchor="end" font-size="22" font-weight="bold" fill="#222">${op}</text>
                    <rect id="rect-${sid}" x="${boxX}" y="${ry}" width="65" height="42" rx="7" ry="7" fill="white" stroke="#444" stroke-width="3"/>
                    <foreignObject x="${boxX}" y="${ry}" width="65" height="42">
                      <div xmlns="http://www.w3.org/1999/xhtml" style="width:65px;height:42px;display:flex;align-items:center;justify-content:center;">
                        <input type="text" id="${sid}" autocomplete="off"
                          style="width:55px;height:34px;border:none;outline:none;font-size:22px;font-weight:bold;text-align:center;background:transparent;"/>
                      </div>
                    </foreignObject>`;
          }
        }

        // Slot consumption order: fracNum → fracDen → topLabel → botLabel → resNum → resDen
        const fracNumSVG = slot(
          d.fracNum,
          "fn",
          58,
          85,
          "middle",
          62,
          12,
          38,
          80,
          60,
          70,
          48,
        );
        const fracDenSVG = slot(
          d.fracDen,
          "fd",
          58,
          170,
          "middle",
          62,
          12,
          125,
          80,
          60,
          70,
          48,
        );
        const topSVG = labelSlot(d.topLabel, "tl", 245, 22, "middle", 180, 2);
        const botSVG = labelSlot(
          d.botLabel,
          "bl",
          245,
          218,
          "middle",
          180,
          198,
        );
        const resNumSVG = slot(
  d.resNum,
  "rn",
  432,
  85,
  "middle",
  25,
  385,
  38,
  110,
  60,
  100,
  48,
);
const resDenSVG = slot(
  d.resDen,
  "rd",
  432,
  170,
  "middle",
  25,
  385,
  116,
  110,
  60,
  100,
  48,
);

        return `
            <div style="display:flex; justify-content:center; align-items:center;">
              <svg width="520" height="230" viewBox="0 0 520 230" style="overflow:visible; max-width:100%;">
                <defs>

                    <path d="M0,0 L0,7 L10,3.5 z" fill="#333"/>

                <!-- LEFT fraction -->
                ${fracNumSVG}
                <line x1="12" y1="103" x2="104" y2="103" stroke="#111" stroke-width="5"/>
                ${fracDenSVG}

                <text x="245" y="128" text-anchor="middle" font-size="52" font-weight="bold" fill="#222">=</text>

                <!-- TOP label above top arrow -->
                ${topSVG}

                <!-- TOP arrow -->
                <path d="M 108 78 Q 255 28 388 78" stroke="#333" stroke-width="2.8" fill="none" marker-end="url(#atop-${aid})"/>

                <!-- BOTTOM arrow -->
                <path d="M 108 155 Q 255 205 388 155" stroke="#333" stroke-width="2.8" fill="none" marker-end="url(#abot-${aid})"/>

                <!-- BOTTOM label below bottom arrow -->
                ${botSVG}

                <!-- RIGHT fraction numerator -->
                ${resNumSVG}

                <!-- Fraction line -->
                <line x1="390" y1="108" x2="475" y2="108" stroke="#444" stroke-width="4"/>

                <!-- RIGHT fraction denominator -->
                ${resDenSVG}

              </svg>
            </div>`;

      //
      //  A value table followed by a coordinate grid the student plots on.

      let tgPoints = [];

      function tgGeom(g) {
        const cell = g.cellSize || 34;

        return {
          cell, pad, W, H,
          xMin: g.xMin, xMax: g.xMax, yMin: g.yMin, yMax: g.yMax,
          px: (x) => pad + (x - g.xMin) * cell,
          py: (y) => pad + (g.yMax - y) * cell,
        };

      function buildGraphHTML(g) {
        const G = tgGeom(g);
        // width:100% + height:auto keeps the rendered box the same shape as the
        // viewBox, which is what tgHandleClick's scale factor relies on. The
        // enclosing .tg-graph-box is what caps the size, so no max-width here.
        let s = `<svg id="tg-svg" width="${G.W}" height="${G.H}" viewBox="0 0 ${G.W} ${G.H}" style="width:100%; height:auto; display:block;">`;

        s += `<defs>

        for (let x = G.xMin; x <= G.xMax; x++) {
          s += `<line class="tg-grid-line" x1="${G.px(x)}" y1="${G.py(G.yMax)}" x2="${G.px(x)}" y2="${G.py(G.yMin)}"/>`;
        }
        for (let y = G.yMin; y <= G.yMax; y++) {
          s += `<line class="tg-grid-line" x1="${G.px(G.xMin)}" y1="${G.py(y)}" x2="${G.px(G.xMax)}" y2="${G.py(y)}"/>`;

        // Axes (drawn a little past the grid so the arrowheads sit outside)
        s += `<line class="tg-axis" x1="${G.px(G.xMin) - 10}" y1="${G.py(0)}" x2="${G.px(G.xMax) + 16}" y2="${G.py(0)}" marker-end="url(#tg-arrow)"/>`;
        s += `<line class="tg-axis" x1="${G.px(0)}" y1="${G.py(G.yMin) + 10}" x2="${G.px(0)}" y2="${G.py(G.yMax) - 16}" marker-end="url(#tg-arrow)"/>`;

        for (let x = G.xMin; x <= G.xMax; x++) {

          s += `<text class="tg-tick-label" x="${G.px(x)}" y="${G.py(0) + 17}" text-anchor="middle">${x}</text>`;
        }

        s += `<text class="tg-axis-name" x="${G.px(0) + 12}" y="${G.py(G.yMax) - 12}" text-anchor="middle">y</text>`;

        // Transparent click surface, then the student's plot on top
        s += `<rect class="tg-hit" x="${G.px(G.xMin)}" y="${G.py(G.yMax)}" width="${(G.xMax - G.xMin) * G.cell}" height="${(G.yMax - G.yMin) * G.cell}"/>`;
        s += `<g id="tg-plot"></g>`;
        s += `</svg>`;
        return s;

      //  marks == null  → plain plotting state, every dot the same red

        const q = data[currentIndex];
        const rows = q.table.rows;
        const feedback = document.getElementById("feedbackText");
        const nextBtn = document.getElementById("nextBtn");
        const checkBtn = document.querySelector(".checkBtn");
        const pointSound = document.getElementById("points-sound");
        const failSound = document.getElementById("fail");

        let allCorrect = true;
        const idsToDisable = [];

        // ── 1. the table ──────────────────────────────────────────────────────
        rows.forEach((row, r) => {
          row.cells.forEach((cell, c) => {
            if (!isBlankCell(cell)) return;
            const elId = `tg_cell_${r}_${c}`;
            const el = document.getElementById(elId);
            const correct = (row.answers || [])[c];
            const isCorrect = compareAnswers(
              el ? el.value : "",
              correct === undefined || correct === null ? "" : String(correct),
            );
            styleInputBox(elId, isCorrect);
            if (!isCorrect) allCorrect = false;
            idsToDisable.push(elId);
          });
        });

        // ── 2. the plotted points ─────────────────────────────────────────────
        const expected = q.graph.points.map((p) => `${p[0]},${p[1]}`);
        const marks = tgPoints.map((p) => expected.includes(`${p[0]},${p[1]}`));
        const plotted = new Set(tgPoints.map((p) => `${p[0]},${p[1]}`));
        const graphCorrect =
          plotted.size === expected.length && marks.every(Boolean);
        tgRedraw(marks);
        if (!graphCorrect) allCorrect = false;

        if (allCorrect) {
          pointSound.currentTime = 0;
          pointSound.play();
          feedback.innerHTML = `<span class='emoji'>✅</span> Correct! Great job!`;
          feedback.style.color = "#4CAF50";
          idsToDisable.forEach((id) => {
            const el = document.getElementById(id);
            if (el) el.disabled = true;
          });
          tgLocked = true;
          const svg = document.getElementById("tg-svg");
          if (svg) svg.classList.add("tg-locked");
          if (checkBtn) checkBtn.style.display = "none";
          nextBtn.innerText = currentIndex + 1 < data.length ? "Next" : "Finish";
          nextBtn.style.display = "block";
        } else {
          failSound.currentTime = 0;
          failSound.play();
          feedback.innerHTML = `<span class='emoji'>❌</span> Try again!`;
          feedback.style.color = "#f44336";
        }
      }
      // ─── Graph ────────────────────────────────────────────────────────────────
      //
      //  A coordinate grid on its own — no table. Same plotting logic as
      //  table-graph: the student clicks the dots, and the line is only drawn
      //  once dots are on the grid, joining them left-to-right. Clicking a dot
      //  again removes it, so click order never matters.
      //
      //  The points that carry the rule have to be plotted — "mustPlot". For
      //  x = 1 that is (1,0); for a question worked from its intercepts it is
      //  both of them. Beyond those, the student may plot wherever they like
      //  inside the range, as long as each dot sits on the line. Clicks outside
      //  the range are refused, so they can only work within it.
      //
      //  JSON shape:
      //    "type": "graph",
      //    "question": [ ... ],
      //    "graph": {
      //      "xMin": -5, "xMax": 5, "yMin": -5, "yMax": 5,
      //      "line": { "x": 1 },              // vertical    x = 1
      //      // "line": { "y": 2 }            // horizontal  y = 2
      //      // "line": { "m": -1, "b": 2 }   // y = mx + b
      //      "mustPlot": [[1, 0]],
      //      "range": { "axis": "y", "from": -3, "to": 3 }
      //    }
      //
      //  "range.axis" is the axis the range is counted along — "y" for a
      //  vertical line (x = 1), "x" for everything else. So the range above
      //  lets the student plot anywhere from y = -3 to y = 3.
      //
      //  Every "mustPlot" point has to sit inside that range, or the question
      //  can never be answered.
      //
      //  "m" may be a whole number or [numerator, denominator] for a fraction.
      //  Optional graph key: "cellSize" (default 34).
      //  An "input"/"correct" pair may be added too — the blanks are then
      //  checked alongside the plot (see Q25, Q26).
      //
      let glPoints = [];
      let glLocked = false;

      // Every line form reduces to integers A·x + B·y = C, so the check below
      // stays exact — no floating point creeping in.
      function glLineABC(line) {
        if (line.x !== undefined) return { A: 1, B: 0, C: line.x };
        if (line.y !== undefined) return { A: 0, B: 1, C: line.y };
        const num = Array.isArray(line.m) ? line.m[0] : line.m;
        const den = Array.isArray(line.m) ? line.m[1] : 1;
        const b = line.b || 0;
        // y = (num/den)x + b  →  -num·x + den·y = den·b
        return { A: -num, B: den, C: den * b };
      }

      // Clicks are refused outside the range, so the student can only plot
      // within it. Only the range's own axis is limited — the other one is
      // free, and a point off the line is simply marked wrong.
      function glInRange(g, x, y) {
        const r = g.range;
        const v = r.axis === "y" ? y : x;
        return v >= Math.min(r.from, r.to) && v <= Math.max(r.from, r.to);
      }

      //  marks == null  → plain plotting state, every dot the same red
      //  marks != null  → feedback state, one entry per plotted point:
      //                   true  = green dot inside a green ring
      //                   false = red cross inside a red ring
      function glRedraw(marks, allOk) {
        const g = data[currentIndex].graph;
        const G = tgGeom(g);
        const plot = document.getElementById("tg-plot");
        if (!plot) return;

        // The band the student is allowed to plot in, so the limit is visible.
        let s = "";
if (g.range) {
  const r = g.range;
  const lo = Math.min(r.from, r.to);
  const hi = Math.max(r.from, r.to);
  if (r.axis === "y") {
    s += `<rect class="gl-band" x="${G.px(G.xMin)}" y="${G.py(hi)}" width="${(G.xMax - G.xMin) * G.cell}" height="${(hi - lo) * G.cell}"/>`;
  } else {
    s += `<rect class="gl-band" x="${G.px(lo)}" y="${G.py(G.yMax)}" width="${(hi - lo) * G.cell}" height="${(G.yMax - G.yMin) * G.cell}"/>`;
  }
}

if (g.line && glPoints.length > 1) {
          const ordered = glPoints
            .slice()
            .sort((a, b) => a[0] - b[0] || a[1] - b[1]);
          const coords = ordered
            .map((p) => `${G.px(p[0])},${G.py(p[1])}`)
            .join(" ");
          let lineCls = "tg-line";
          if (marks) {
            lineCls += " marked";
            // green only when the plot as a whole passed — a dot may sit on
            // the line and the answer still be short of a mustPlot point
            if (allOk) lineCls += " correct";
          }
          s += `<polyline class="${lineCls}" points="${coords}"/>`;
        }

        glPoints.forEach((p, i) => {
          const cx = G.px(p[0]);
          const cy = G.py(p[1]);

          if (!marks) {
            s += `<circle class="tg-point" cx="${cx}" cy="${cy}" r="5.5"/>`;
          } else if (marks[i]) {
            s += `<circle class="tg-mark-ring correct" cx="${cx}" cy="${cy}" r="10"/>`;
            s += `<circle class="tg-point correct" cx="${cx}" cy="${cy}" r="5"/>`;
          } else {
            const d = 6;
            s += `<circle class="tg-mark-ring incorrect" cx="${cx}" cy="${cy}" r="10"/>`;
            s += `<line class="tg-cross" x1="${cx - d}" y1="${cy - d}" x2="${cx + d}" y2="${cy + d}"/>`;
            s += `<line class="tg-cross" x1="${cx - d}" y1="${cy + d}" x2="${cx + d}" y2="${cy - d}"/>`;
          }
        });
        plot.innerHTML = s;
      }

      function glHandleClick(e) {
        if (glLocked) return;
        const g = data[currentIndex].graph;
        const G = tgGeom(g);
        const svg = document.getElementById("tg-svg");
        if (!svg) return;

        // Map the click into SVG user units (the svg may be scaled by max-width)
        const rect = svg.getBoundingClientRect();
        const sx = (e.clientX - rect.left) * (G.W / rect.width);
        const sy = (e.clientY - rect.top) * (G.H / rect.height);

        // Snap to the nearest whole coordinate
        const x = Math.round((sx - G.pad) / G.cell + G.xMin);
        const y = Math.round(G.yMax - (sy - G.pad) / G.cell);
        if (x < G.xMin || x > G.xMax || y < G.yMin || y > G.yMax) return;
        if (g.range && !glInRange(g, x, y)) return;

        const at = glPoints.findIndex((p) => p[0] === x && p[1] === y);
        if (at >= 0) glPoints.splice(at, 1);
        else glPoints.push([x, y]);
        glRedraw();
      }

      function glInit() {
        glPoints = [];
        glLocked = false;
        const svg = document.getElementById("tg-svg");
        if (!svg) return;
        svg.addEventListener("click", glHandleClick);
        glRedraw();
      }

      function renderGraphQuestion(q) {
        const graphW = Math.round(tgGeom(q.graph).W * 0.9);

        let questionText = processQuestionContent(q.question);
        if (q.input) {
          let inputIndex = 0;
          questionText = questionText.replace(
            /_{3,}/g,
            () =>
              `<input type="text" class="inline-input" id="input_${inputIndex++}" />`,
          );
        }

        let html = `<h3 class="questionText">${questionText}</h3>`;
        html += `<div class="gl-wrapper">`;
        html += `<div class="tg-graph-box" style="--tg-w:${graphW}px;">${buildGraphHTML(q.graph)}</div>`;
        html += `</div>`;

        html += `<div class='inputBottomSection' style="margin-top:18px;">
                    <div class='inputFeedbackSection'><p class="feedbackText" id="feedbackText"></p></div>
                    <div class='inputButtonSection'>
                      <button class="checkBtn" onclick="handleGraphCheck()">Submit</button>
                      <button class="nextBtn" id="nextBtn" style="display:none;" onclick="handleNext()">Next</button>
                    </div>
                  </div>`;

        return html;
      }

      function handleGraphCheck() {
        const q = data[currentIndex];
        const feedback = document.getElementById("feedbackText");
        const nextBtn = document.getElementById("nextBtn");
        const checkBtn = document.querySelector(".checkBtn");
        const pointSound = document.getElementById("points-sound");
        const failSound = document.getElementById("fail");

        let allCorrect = true;
        const idsToDisable = [];

        // ── 1. the blanks, when the question has any ──────────────────────────
        if (q.input) {
          (q.correct || []).forEach((answer, i) => {
            const elId = `input_${i}`;
            const el = document.getElementById(elId);
            if (!el) return;
            const isCorrect = compareAnswers(el.value, String(answer));
            styleInputBox(elId, isCorrect);
            if (!isCorrect) allCorrect = false;
            idsToDisable.push(elId);
          });
        }

       // ── 2. the plotted points ─────────────────────────────────────────────
let graphCorrect;
let marks;
if (q.graph.line) {
  // Line mode: dots must sit on the line, mustPlot points required, 2+ dots.
  const { A, B, C } = glLineABC(q.graph.line);
  marks = glPoints.map((p) => A * p[0] + B * p[1] === C);
  const plotted = glPoints.map((p) => `${p[0]},${p[1]}`);
  const hasMustPlot = (q.graph.mustPlot || []).every((p) =>
    plotted.includes(`${p[0]},${p[1]}`),
  );
  graphCorrect = glPoints.length > 1 && marks.every(Boolean) && hasMustPlot;
} else {
  // Point mode: exactly the mustPlot point(s), one click is enough.
  const must = q.graph.mustPlot || [];
  const mustSet = must.map((p) => `${p[0]},${p[1]}`);
  const plottedSet = glPoints.map((p) => `${p[0]},${p[1]}`);
  marks = glPoints.map((p) => mustSet.includes(`${p[0]},${p[1]}`));
  graphCorrect =
    glPoints.length === must.length &&
    marks.every(Boolean) &&
    must.every((p) => plottedSet.includes(`${p[0]},${p[1]}`));
}
glRedraw(marks, graphCorrect);
if (!graphCorrect) allCorrect = false;

        if (allCorrect) {
          pointSound.currentTime = 0;
          pointSound.play();
          feedback.innerHTML = `<span class='emoji'>✅</span> Correct! Great job!`;
          feedback.style.color = "#4CAF50";
          idsToDisable.forEach((id) => {
            const el = document.getElementById(id);
            if (el) el.disabled = true;
          });
          glLocked = true;
          const svg = document.getElementById("tg-svg");
          if (svg) svg.classList.add("tg-locked");
          if (checkBtn) checkBtn.style.display = "none";
          nextBtn.innerText = currentIndex + 1 < data.length ? "Next" : "Finish";
          nextBtn.style.display = "block";
        } else {
          failSound.currentTime = 0;
          failSound.play();
          feedback.innerHTML = `<span class='emoji'>❌</span> Try again!`;
          feedback.style.color = "#f44336";
        }
      }

      function handleOptionClick(index) {
        const pointSound = document.getElementById("points-sound");
        const failSound = document.getElementById("fail");
        if (selectedAnswer !== null) return;

        selectedAnswer = index;
        const q = data[currentIndex];
        const feedback = document.getElementById("feedbackText");
        const nextBtn = document.getElementById("nextBtn");
        const optionBtns = document.querySelectorAll(
          ".optionBtn, .imageOption",
        );

        optionBtns.forEach((btn) => {
          btn.style.pointerEvents = "none";
        });

        if (index === q.correct) {
          pointSound.currentTime = 0;
          pointSound.play();
          optionBtns[index].classList.add("correct");
          feedback.innerHTML = `<span class='emoji'>✅</span> Correct! Great job!`;
          feedback.style.color = "#4CAF50";
          nextBtn.innerText =
            currentIndex + 1 < data.length ? "Next" : "Finish";
          nextBtn.style.display = "block";
        } else {
          failSound.currentTime = 0;
          failSound.play();
          optionBtns[index].classList.add("incorrect");
          feedback.innerHTML = `<span class='emoji'>❌</span> Try again!`;
          feedback.style.color = "#f44336";
          optionBtns.forEach((btn, idx) => {
            if (idx !== index) btn.style.pointerEvents = "auto";
          });
          selectedAnswer = null;
        }
      }
function validatePairs(values, allowed) {
  const counts = {};

  values.forEach(v => {
    const key = Number(v);
    counts[key] = (counts[key] || 0) + 1;
  });

  return Object.keys(allowed).every(
    key => counts[Number(key)] === allowed[key]
  ) && Object.keys(counts).every(
    key => allowed[Number(key)] !== undefined
  );
}



      function handleNext() {
        selectedHybridOption = null;
        if (currentIndex + 1 < data.length) {
          currentIndex++;
          selectedAnswer = null;
          userInputs = [];
          renderQuestion();
        } else {
          currentIndex++;
          renderQuestion();
        }
      }
    </script>
  </body>
